name: Portfolio PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Lint workflow component and integration
        run: npx eslint src/components/PortfolioWorkflow.jsx src/views/AboutView.jsx

      - name: Build production website
        run: npm run build
